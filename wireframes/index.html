<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SMIS Wireframes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="masthead">
        <div>
            <p class="eyebrow">SMIS / interface inventory</p>
            <h1>Low-fidelity page wireframes</h1>
            <p class="lede">A structural view of every user-facing screen, organized by role and workflow.</p>
        </div>
        <div class="summary" aria-label="Wireframe summary">
            <strong id="screen-count">0</strong>
            <span>screens</span>
        </div>
    </header>

    <nav class="filters" aria-label="Filter wireframes">
        <button class="filter active" data-filter="all">All pages</button>
        <button class="filter" data-filter="auth">Auth</button>
        <button class="filter" data-filter="admin">Admin</button>
        <button class="filter" data-filter="teacher">Teacher</button>
        <button class="filter" data-filter="student">Student</button>
        <button class="filter" data-filter="settings">Settings</button>
    </nav>

    <main id="wireframe-board"></main>

    <script>

            { group: 'admin', title: 'Academic years', path: '/admin/academic-years', type: 'table', blocks: ['Current year banner', 'Academic year table', 'Create and row actions'] },

            { group: 'admin', title: 'Classes', path: '/admin/classes', type: 'table', blocks: ['Search and filters', 'Class table', 'Create and row actions'] },
            { group: 'admin', title: 'Create class', path: '/admin/classes/create', type: 'form', blocks: ['Class name field', 'Grade and stream selectors', 'Save / cancel actions'] },

            { group: 'admin', title: 'Create relief assignment', path: '/admin/relief-assignments/create', type: 'form', blocks: ['Absent teacher selector', 'Relief teacher selector', 'Lesson and date fields'] },
            { group: 'admin', title: 'Attendance sessions', path: '/admin/attendance/sessions', type: 'table', blocks: ['Date and class filters', 'Attendance session table', 'Create and finalize actions'] },
            { group: 'admin', title: 'Create attendance session', path: '/admin/attendance/sessions/create', type: 'form', blocks: ['Class and date selectors', 'Session details', 'Create action'] },
            { group: 'admin', title: 'Edit attendance session', path: '/admin/attendance/sessions/{session}/edit', type: 'form', blocks: ['Session summary', 'Student attendance checklist', 'Save / finalize actions'] },
            { group: 'admin', title: 'Monthly attendance', path: '/admin/attendance/monthly', type: 'report', blocks: ['Month and class filters', 'Attendance summary cards', 'Attendance matrix'] },

            { group: 'admin', title: 'Edit exam', path: '/admin/exams/{exam}/edit', type: 'form', blocks: ['Exam details form', 'Publication status', 'Save / publish actions'] },
            { group: 'admin', title: 'Exam subjects', path: '/admin/exams/{exam}/subjects', type: 'form', blocks: ['Exam summary', 'Subject and maximum mark grid', 'Save subjects action'] },
            { group: 'admin', title: 'Mark entry', path: '/admin/marks', type: 'table', blocks: ['Exam and class selectors', 'Subject mark entry table', 'Open entry action'] },
            { group: 'admin', title: 'Edit marks', path: '/admin/marks/{exam-subject}/edit', type: 'form', blocks: ['Exam subject summary', 'Student marks grid', 'Save marks action'] },

            { group: 'admin', title: 'At-risk report', path: '/admin/reports/at-risk', type: 'report', blocks: ['Threshold filters', 'At-risk student table', 'Summary chart'] },
            { group: 'admin', title: 'Staff attendance report', path: '/admin/reports/staff-attendance', type: 'report', blocks: ['Date and staff filters', 'Attendance trend chart', 'Staff summary table'] },
            { group: 'admin', title: 'Enrollment report', path: '/admin/reports/enrollment', type: 'report', blocks: ['Year and class filters', 'Enrollment stat cards', 'Enrollment breakdown chart'] },
            { group: 'admin', title: 'Examination report', path: '/admin/reports/examination', type: 'report', blocks: ['Exam filters', 'Participation summary', 'Examination analysis table'] },
            { group: 'admin', title: 'Exam results report', path: '/admin/reports/exam-results', type: 'report', blocks: ['Exam and class filters', 'Results distribution chart', 'Results table'] },
            { group: 'admin', title: 'Performance report', path: '/admin/reports/performance', type: 'report', blocks: ['Year and subject filters', 'Performance trend chart', 'Ranking table'] },
            { group: 'admin', title: 'Assignments report', path: '/admin/reports/assignments', type: 'report', blocks: ['Teacher and class filters', 'Assignment coverage cards', 'Assignments table'] },
            { group: 'teacher', title: 'Teacher dashboard', path: '/teacher/dashboard', type: 'dashboard', blocks: ['KPI stat row', 'Today schedule panel', 'Attendance and lesson charts', 'Quick actions'] },
            { group: 'teacher', title: 'My students', path: '/teacher/students', type: 'table', blocks: ['Class selector and search', 'Student table', 'Create and row actions'] },
            { group: 'teacher', title: 'Create student', path: '/teacher/students/create', type: 'form', blocks: ['Student details form', 'Class selector', 'Save / cancel actions'] },
            { group: 'teacher', title: 'Edit student', path: '/teacher/students/{student}/edit', type: 'form', blocks: ['Student details form', 'Class selector', 'Save / cancel actions'] },
            { group: 'teacher', title: 'Lessons', path: '/teacher/lessons', type: 'table', blocks: ['Search and class filters', 'Lesson table', 'Create and row actions'] },
            { group: 'teacher', title: 'Create lesson', path: '/teacher/lessons/create', type: 'form', blocks: ['Lesson title and class', 'Content editor area', 'Save / cancel actions'] },
            { group: 'teacher', title: 'Lesson detail', path: '/teacher/lessons/{lesson}', type: 'detail', blocks: ['Lesson heading and metadata', 'Lesson content area', 'Student resources'] },
            { group: 'teacher', title: 'Edit lesson', path: '/teacher/lessons/{lesson}/edit', type: 'form', blocks: ['Lesson details form', 'Content editor area', 'Save / delete actions'] },
            { group: 'teacher', title: 'My timetable', path: '/teacher/timetable', type: 'calendar', blocks: ['Week navigation', 'Weekly timetable grid', 'Lesson detail links'] },
            { group: 'teacher', title: 'EMIS data sheet', path: '/teacher/data-sheet', type: 'form', blocks: ['Teacher and school metadata', 'Structured data sections', 'Export PDF action'] },
            { group: 'teacher', title: 'Attendance sessions', path: '/teacher/attendance/sessions', type: 'table', blocks: ['Class and date filters', 'Session table', 'Create and edit actions'] },
            { group: 'teacher', title: 'Create attendance session', path: '/teacher/attendance/sessions/create', type: 'form', blocks: ['Class and date selectors', 'Session details', 'Create action'] },
            { group: 'teacher', title: 'Edit attendance session', path: '/teacher/attendance/sessions/{session}/edit', type: 'form', blocks: ['Session summary', 'Student attendance checklist', 'Save / finalize actions'] },
            { group: 'teacher', title: 'Monthly attendance', path: '/teacher/attendance/monthly', type: 'report', blocks: ['Month and class filters', 'Attendance summary cards', 'Attendance matrix'] },
            { group: 'teacher', title: 'My attendance', path: '/teacher/attendance/self', type: 'form', blocks: ['Date selector', 'Attendance status', 'Submit attendance action', 'History table'] },

            { group: 'teacher', title: 'Edit marks', path: '/teacher/marks/{exam-subject}/edit', type: 'form', blocks: ['Exam subject summary', 'Student marks grid', 'Save marks action'] },
            { group: 'teacher', title: 'Reports catalog', path: '/teacher/reports', type: 'catalog', blocks: ['Report category filters', 'Report link grid'] },
            { group: 'teacher', title: 'Attendance report', path: '/teacher/reports/attendance', type: 'report', blocks: ['Filters and export actions', 'Attendance trend chart', 'Class summary table'] },
            { group: 'teacher', title: 'At-risk report', path: '/teacher/reports/at-risk', type: 'report', blocks: ['Threshold filters', 'At-risk student table', 'Summary chart'] },
            { group: 'teacher', title: 'Enrollment report', path: '/teacher/reports/enrollment', type: 'report', blocks: ['Year and class filters', 'Enrollment stat cards', 'Breakdown chart'] },
            { group: 'teacher', title: 'Examination report', path: '/teacher/reports/examination', type: 'report', blocks: ['Exam filters', 'Participation summary', 'Analysis table'] },
            { group: 'teacher', title: 'Exam results report', path: '/teacher/reports/exam-results', type: 'report', blocks: ['Exam and class filters', 'Results chart', 'Results table'] },
            { group: 'teacher', title: 'Performance report', path: '/teacher/reports/performance', type: 'report', blocks: ['Year and subject filters', 'Performance chart', 'Ranking table'] },
            { group: 'student', title: 'Student dashboard', path: '/student/dashboard', type: 'dashboard', blocks: ['Welcome and KPI row', 'Upcoming lessons panel', 'Attendance and results summary'] },
            { group: 'student', title: 'Class timetable', path: '/student/timetable', type: 'calendar', blocks: ['Week navigation', 'Class timetable grid', 'Lesson detail links'] },
            { group: 'student', title: 'My attendance', path: '/student/attendance', type: 'report', blocks: ['Attendance summary cards', 'Monthly attendance chart', 'Attendance history table'] },
            { group: 'student', title: 'My results', path: '/student/results', type: 'table', blocks: ['Exam selector', 'Results summary', 'Subject results table'] },
            { group: 'student', title: 'Lessons', path: '/student/lessons', type: 'table', blocks: ['Subject and date filters', 'Lesson list', 'Lesson detail links'] },
            { group: 'student', title: 'Lesson detail', path: '/student/lessons/{lesson}', type: 'detail', blocks: ['Lesson heading and metadata', 'Lesson content area', 'Resources and navigation'] },
            { group: 'student', title: 'Reports catalog', path: '/student/reports', type: 'catalog', blocks: ['Personal report link grid'] },
            { group: 'student', title: 'Attendance report', path: '/student/reports/attendance', type: 'report', blocks: ['Date filters', 'Attendance summary', 'Attendance detail table'] },
            { group: 'student', title: 'Results report', path: '/student/reports/results', type: 'report', blocks: ['Exam filters', 'Results summary', 'Subject breakdown table'] },
            { group: 'student', title: 'Combined personal report', path: '/student/report', type: 'report', blocks: ['Report filters', 'Attendance and results summary', 'Export actions'] },
            { group: 'settings', title: 'Profile settings', path: '/settings/profile', type: 'form', blocks: ['Profile details form', 'Email verification status', 'Save profile action'] },
            { group: 'settings', title: 'Appearance settings', path: '/settings/appearance', type: 'form', blocks: ['Language selector', 'Theme preferences', 'Save preferences action'] },
            { group: 'settings', title: 'Security settings', path: '/settings/security', type: 'form', blocks: ['Current password field', 'New password fields', 'Two-factor settings', 'Save security action'] }
        ];

        const board = document.querySelector('#wireframe-board');
        const count = document.querySelector('#screen-count');

        function drawShape(type) {
            if (type === 'table') return '<div class="shape filters-shape"></div><div class="shape table-shape"><i></i><i></i><i></i><i></i><i></i></div>';
            if (type === 'form') return '<div class="shape form-shape"><i></i><i></i><i></i><i></i></div><div class="shape action-shape"></div>';
            if (type === 'dashboard') return '<div class="shape stats-shape"><i></i><i></i><i></i></div><div class="shape chart-shape"></div><div class="shape chart-shape short"></div>';
            if (type === 'calendar') return '<div class="shape filters-shape"></div><div class="shape calendar-shape"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
            if (type === 'chat') return '<div class="shape chat-shape"><i></i><i></i><i></i></div><div class="shape composer-shape"></div>';
            if (type === 'detail') return '<div class="shape profile-shape"></div><div class="shape content-shape"></div><div class="shape content-shape short"></div>';
            if (type === 'catalog') return '<div class="shape catalog-shape"><i></i><i></i><i></i><i></i></div>';
            if (type === 'status') return '<div class="shape status-shape"></div><div class="shape action-shape"></div>';
            return '<div class="shape report-shape"></div><div class="shape chart-shape"></div><div class="shape table-shape compact"><i></i><i></i><i></i></div>';
        }

        function render(filter = 'all') {
            const visible = pages.filter(page => filter === 'all' || page.group === filter || (filter === 'auth' && page.group === 'common'));
            count.textContent = visible.length;
            board.innerHTML = visible.map((page, index) => `
                <article class="wireframe ${page.group}" id="${page.path.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '')}">
                    <div class="screen-heading"><span class="number">${String(index + 1).padStart(2, '0')}</span><span class="tag">${page.group}</span></div>
                    <h2>${page.title}</h2>
                    <code>${page.path}</code>
                    <div class="browser-frame">
                        <div class="browser-bar"><span></span><span></span><span></span></div>
                        <div class="browser-body"><aside></aside><section>${drawShape(page.type)}</section></div>
                    </div>
                    <ul>${page.blocks.map(block => `<li>${block}</li>`).join('')}</ul>
                </article>
            `).join('');
        }

        document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
            document.querySelector('.filter.active').classList.remove('active');
            button.classList.add('active');
            render(button.dataset.filter);
        }));

        render();
    </script>
</body>
</html>
